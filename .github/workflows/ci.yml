# CI do site estático "career": sem build. O npm ci instala só as ferramentas de desenvolvimento (ESLint e Prettier).
# Roda a verificação estática (docs/claudeia/verificar.ps1), confere a sintaxe dos módulos JS, o lint e a formatação,
# e executa os testes com o test runner nativo do Node (node --test).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Ferramentas de desenvolvimento (npm ci)
        run: npm ci

      - name: Verificações estáticas (arquivos, dados, links locais)
        shell: pwsh
        run: ./docs/claudeia/verificar.ps1

      - name: Sintaxe dos módulos JS
        run: |
          set -e
          for f in main.js js/*.js; do
            node --input-type=module --check < "$f"
            echo "ok $f"
          done

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatação (Prettier; as cópias geradas pela API ficam no .prettierignore)
        run: npm run format:check

      - name: Testes (node --test)
        run: node --test "tests/*.test.js"
