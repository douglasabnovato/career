<!doctype html>
<html lang="pt-BR" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://learntech-content.douglasabnovato.workers.dev https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src https://fonts.gstatic.com https://unpkg.com; img-src 'self' data: https://learntech-content.douglasabnovato.workers.dev https://www.google.com https://*.gstatic.com; connect-src 'self' https://learntech-content.douglasabnovato.workers.dev; frame-src https://www.youtube-nocookie.com https://challenges.cloudflare.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Página não encontrada | Career | learnTECH</title>
    <meta name="description" content="O endereço acessado não existe no Career, a curadoria de carreira tech do ecossistema learnTECH." />
    <meta name="robots" content="noindex" />

    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />

    <!--
      O GitHub Pages serve este arquivo para qualquer caminho inexistente em /career/ (inclusive em subpastas),
      por isso os caminhos são absolutos a partir de /career/ e não relativos. Em "npx serve ." local, abra /404.html
      sabendo que o CSS e a imagem só carregam no endereço publicado.
    -->
    <link rel="icon" href="/career/public/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@400;700&family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="/career/css/layout.css" />
    <link rel="stylesheet" href="/career/css/style.css" />
    <link rel="stylesheet" href="/career/css/cards.css" />
    <link rel="stylesheet" href="/career/css/detalhe.css" />

    <script src="/career/js/tema-inicial.js"></script>
  </head>

  <body>
    <main id="main-content" class="detalhe-page">
      <div class="container detalhe-container">
        <section class="detalhe-estado">
          <img
            src="/career/assets/error/oops-404-error.webp"
            alt=""
            width="280"
            height="280"
            decoding="async"
            style="max-width: 100%; height: auto; margin: 0 auto 1.5rem; display: block"
          />
          <h1>Página não encontrada</h1>
          <p>O endereço que você abriu não existe no Career. Ele pode ter mudado de lugar ou sido digitado com algum erro.</p>
          <div class="detalhe-estado__acoes">
            <a href="/career/" class="visit-btn">
              <i class="bx bx-arrow-back" aria-hidden="true"></i>
              <span>Voltar ao catálogo</span>
            </a>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
